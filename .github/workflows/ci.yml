name: ci

on:
  pull_request:
    branches:
      - release
      - 'release-*'
  push:
    branches:
      - release
      - 'release-*'
      - main

jobs:
  build-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cli2ansible
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/pyproject.toml') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Lint & Type check
        run: |
          poetry run ruff check .
          poetry run mypy src

      - name: Run Tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cli2ansible
        run: poetry run pytest --maxfail=1 --disable-warnings -q --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          override_branch: ${{ github.ref_name }}
          override_commit: ${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check if tests exist
        id: check-tests
        working-directory: frontend
        run: |
          if grep -q '"test"' package.json && \
             (find . -name "*.test.*" -o -name "*.spec.*" -o -type d -name "__tests__" 2>/dev/null | grep -q .); then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run frontend tests
        if: steps.check-tests.outputs.exists == 'true'
        working-directory: frontend
        run: npm test -- --coverage --coverageReporters=text
